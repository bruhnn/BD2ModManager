name: publish

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: installer
            os: windows-latest
            argsWithoutMsi: --bundles nsis
            assetNamePattern: 'BD2ModManager_[version]-Windows[setup][ext]'
          - name: portable
            os: windows-latest
            args: --no-bundle --features portable
            uploadPlainBinary: true
            assetNamePattern: 'BD2ModManager_[version]-Windows-portable[ext]'
          # AppImage gets the linux-x86_64 updater entry in latest.json
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            assetNamePattern: 'BD2ModManager_[version]-Linux[ext]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # BD2ModPreview.exe is only bundled on Windows (tauri.windows.conf.json)
      - name: Download bundled tools
        if: runner.os == 'Windows'
        run: pnpm download:modpreview

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Get build args
        id: build_args
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          MATRIX_NAME="${{ matrix.name }}"
          if [[ "$MATRIX_NAME" == "installer" && ( "$VERSION" == *"-dev"* || "$VERSION" == *"-beta"* ) ]]; then
            echo "Dev/Beta installer: skipping MSI"
            echo "args=${{ matrix.argsWithoutMsi }}" >> $GITHUB_OUTPUT
          else
            echo "args=${{ matrix.args }}" >> $GITHUB_OUTPUT
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'BD2ModManager v__VERSION__'
          releaseDraft: true
          args: ${{ steps.build_args.outputs.args }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary || false }}
          assetNamePattern: ${{ matrix.assetNamePattern || '' }}