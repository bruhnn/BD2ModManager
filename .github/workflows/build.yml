name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: installer
            os: windows-latest
            args: --no-sign
            argsWithoutMsi: --no-sign --no-bundle --bundles nsis
          - name: portable
            os: windows-latest
            args: --no-bundle --features portable
          - name: linux
            os: ubuntu-22.04
            args: --no-sign --bundles appimage,deb

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      # BD2ModPreview.exe is only bundled on Windows (tauri.windows.conf.json)
      - name: Download bundled tools
        if: runner.os == 'Windows'
        run: pnpm download:modpreview

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          MATRIX_NAME="${{ matrix.name }}"

          if [[ "$MATRIX_NAME" == "installer" && ( "$VERSION" == *"-dev"* || "$VERSION" == *"-beta"* ) ]]; then
            echo "Dev/Beta installer build detected: $VERSION"
            pnpm tauri build ${{ matrix.argsWithoutMsi }}
          else
            echo "Normal build: $VERSION ($MATRIX_NAME)"
            pnpm tauri build ${{ matrix.args }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/BD2ModManager.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
